services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    networks:
      - kosy-net
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "80:80"   # dostęp publiczny przez serwer
    networks:
      - kosy-net

networks:
  kosy-net:
    driver: bridge
