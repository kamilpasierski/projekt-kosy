version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    networks:
      - kosy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "80:80"   # dostęp publiczny przez serwer
    networks:
      - kosy-net

networks:
  kosy-net:
    driver: bridge
