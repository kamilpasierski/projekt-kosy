name: CI/CD Pipeline - Projekt Kosy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  backend-qa:
    name: Backend QA & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # Instalujemy coverage-badge ręcznie tutaj
          pip install flake8 pytest pytest-django mysqlclient coverage coverage-badge

      - name: Linting (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Tests & Generate Coverage
        env:
          SECRET_KEY: "django-insecure-test-key"
          DEBUG: "True"
          DB_ENGINE: "django.db.backends.mysql"
          DB_NAME: "test_db"
          DB_USER: "root"
          DB_PASSWORD: "root_password"
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
        run: |
          coverage run -m pytest
          coverage report
          # To stworzy plik .coverage w folderze backend/

      
      - name: Generate Coverage Badge
        run: |
          # Jesteśmy w folderze ./backend (dzięki defaults.run)
          # coverage-badge sam znajdzie plik .coverage w tym folderze
          coverage-badge -o coverage.svg -f

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v16
        id: verify-changed-files
        with:
          files: backend/coverage.svg

      - name: Commit & Push Badge
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Dodajemy plik, który powstał w backend/
          git add coverage.svg
          git commit -m "ci: update coverage badge"
          git push

      # -----------------------------------

      - name: Docker Build Verify
        run: docker build . -t backend-image:test

  frontend-qa:
    name: Frontend QA & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Checking
        run: npx tsc --noEmit

      - name: Production Build Check
        run: npm run build

      - name: Docker Build Verify
        run: docker build -f Dockerfile.prod -t frontend-prod:test .